services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE}
    ports:
      - "2001:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - event_driven_booking_postgres_data:/var/lib/postgresql/data

volumes:
  event_driven_booking_postgres_data:
